<?xml version="1.0" encoding="UTF-8"?>
<!-- Monograma ME em folha de ouro, como aplicação em convite.
     Sem bisel: o que faz ler como metal é a faixa tonal alternando claro e
     escuro ao longo da diagonal, imitando a folha refletindo a luz em
     ângulos diferentes. Bisel arredondado, que foi a tentativa anterior,
     lê como texto 3D de editor antigo. Só uma sombra rente para a peça
     não flutuar sobre o tecido. -->
