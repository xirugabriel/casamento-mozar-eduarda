    <path d="M274.27,30.49l-5.79,1.24c.24-2.75,3.18-4.17,5.79-1.24Z"/>
    <path d="M279.52,29.36c.21.22-.5,2.56-.89,2.26l-2.62-2.01,3.51-.25Z"/>
    <path d="M323.54,29.69l1.75-.36c.29-.06.69,1.07.41,1.17l-1.16.44c-.41.15-1.44-1.15-1-1.24Z"/>
  </g>
</svg>
