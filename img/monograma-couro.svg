<?xml version="1.0" encoding="UTF-8"?>
<!-- Monograma ME em couro. A forma é a oficial (ME.svg); o volume vem de
     iluminação SVG real sobre um mapa de altura, e o grão do couro está
     DENTRO desse mapa — é a própria luz que revela a textura, em vez de
     uma camada de ruído colada por cima. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 478.48 314.36">
  <defs>
    <linearGradient id="corCouro" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0"    stop-color="#8A5A34"/>
      <stop offset="0.45" stop-color="#653C1E"/>
      <stop offset="1"    stop-color="#3C2110"/>
    </linearGradient>

    <filter id="couro" x="-14%" y="-18%" width="128%" height="142%"
            color-interpolation-filters="sRGB">
      <!-- grão pedrado do couro, em tom de cinza -->
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="5" seed="3" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="grao"/>

      <!-- mapa de altura: forma amaciada + 12% de grão, para a luz pegar a textura -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="forma"/>
      <feComposite in="forma" in2="grao" operator="arithmetic"
                   k1="0" k2="0.9" k3="0.1" k4="0" result="altura"/>

      <!-- luz difusa: a curvatura da peça -->
      <feDiffuseLighting in="altura" surfaceScale="5" diffuseConstant="0.95"
                         lighting-color="#ffffff" result="difusa">
        <feDistantLight azimuth="228" elevation="40"/>
      </feDiffuseLighting>
      <feComposite in="difusa" in2="SourceAlpha" operator="in" result="difusaC"/>

      <!-- lustro estreito, como couro encerado -->
      <feSpecularLighting in="altura" surfaceScale="5" specularConstant="0.4"
                          specularExponent="20" lighting-color="#FFE8C8" result="brilho">
        <feDistantLight azimuth="228" elevation="62"/>
      </feSpecularLighting>
      <feComposite in="brilho" in2="SourceAlpha" operator="in" result="brilhoC"/>

      <!-- cor do couro multiplicada pela luz, depois somado o lustro -->
      <feComposite in="SourceGraphic" in2="difusaC" operator="arithmetic"
                   k1="1" k2="0" k3="0" k4="0" result="base"/>
      <feComposite in="base" in2="brilhoC" operator="arithmetic"
                   k1="0" k2="1" k3="0.5" k4="0" result="comLuz"/>
      <feComposite in="comLuz" in2="SourceAlpha" operator="in" result="peca"/>

      <!-- sombra da peça sobre o tecido -->
      <feDropShadow in="peca" dx="1" dy="5" stdDeviation="4"
                    flood-color="#07130C" flood-opacity="0.62"/>
    </filter>
  </defs>

  <g filter="url(#couro)" fill="url(#corCouro)">
